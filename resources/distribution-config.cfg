// Clean shared defaults. No personal run aliases or input traces.
unbindall
bind "TAB" "+showscores"
bind "ESCAPE" "cancelselect"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "e" "+use"
bind "r" "+reload"
bind "f" "impulse 100"
bind "q" "lastinv"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "0" "slot10"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MWHEELUP" "invprev"
bind "MWHEELDOWN" "invnext"
bind "F5" "snapshot"
bind "F6" "save quick"
bind "F7" "load quick"
bind "`" "toggleconsole"
bind "~" "toggleconsole"
name "Player"
model "gordon"
sensitivity "3"
volume "0.7"
viewsize "100"
cl_forwardspeed "400"
cl_backspeed "400"
cl_sidespeed "400"
m_filter "0"
joystick "0"
_windowed_mouse "1"
fps_max "100"
fps_modem "0"
clockwindow "0"
+mlook
exec userconfig.cfg
