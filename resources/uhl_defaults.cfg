// UltimateHL v3.7 renderer defaults. Edit this file to change your startup preferences.
// No low-resolution mip bias. Retain normal distance-dependent mipmaps.
// v3.1's nearest sprite appearance, with corrected texel-center alignment.
gl_spriteblend 0
// UHL numeric defaults are registered natively and migrated in preferences.
// Do not issue uhl_* here: that would overwrite saved choices after startup.
gl_texturemode GL_NEAREST_MIPMAP_NEAREST
gl_round_down 0
gl_picmip 0
// Keep the local game running while its console/menu is open.
pausable 0
// UHL preferences are registered with defaults and saved separately.
// Do not reset render scale or load preferences when this file is re-executed.
